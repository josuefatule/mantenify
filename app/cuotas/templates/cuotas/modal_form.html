<div class="modal-header">
    <h5 class="modal-title">
        Nueva cuota - Unidad {{ unidad.nombre }}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form method="POST"
      action="{{ url_for('cuotas.crear_cuota', unidad_id=unidad.id) }}"
      onsubmit="submitForm(event, this)">

  <div class="modal-body">

    <div class="mb-3">
      <label class="form-label">Periodo</label>
      <input type="month" name="periodo" class="form-control"
             value="{{ periodo_default }}" required>
      <div class="form-text">
        Selecciona el mes al que corresponde esta cuota.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Monto (RD$)</label>
      <input type="number" step="0.01" min="0" name="monto"
             class="form-control" required>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn btn-primary">Guardar cuota</button>
  </div>

</form>
