<div class="modal-header">
    <h5 class="modal-title">Editar relación histórica</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form method="POST"
      action="{{ url_for('personas.editar_relacion', rel_id=rel.id) }}"
      onsubmit="submitForm(event, this)">
  
  <div class="modal-body">

      <p><strong>Persona:</strong> {{ rel.persona.nombre_completo }}</p>

      <div class="mb-3">
          <label>Tipo de relación</label>
          <select name="tipo" class="form-select">
              <option value="propietario" {% if rel.es_propietario %}selected{% endif %}>Propietario</option>
              <option value="inquilino" {% if not rel.es_propietario %}selected{% endif %}>Inquilino</option>
          </select>
      </div>

      <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="principal"
                 id="principalCheck"
                 {% if rel.es_principal %}checked{% endif %}>
          <label class="form-check-label" for="principalCheck">
              Es persona principal
          </label>
      </div>

      <div class="mb-3">
          <label>Fecha desde</label>
          <input type="date" name="fecha_desde" class="form-control"
                 value="{{ rel.fecha_desde }}">
      </div>

      <div class="mb-3">
          <label>Fecha hasta</label>
          <input type="date" name="fecha_hasta" class="form-control"
                 value="{{ rel.fecha_hasta }}">
      </div>

  </div>

  <div class="modal-footer">
      <button class="btn btn-primary">Guardar cambios</button>
  </div>

</form>
