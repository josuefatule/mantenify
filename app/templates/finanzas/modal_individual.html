{% set hoy = fecha_hoy.strftime('%Y-%m-%d') %}

<div class="modal-header">
  <h5 class="modal-title">Crear cuota individual</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form method="POST"
      action="{{ url_for('finanzas.crear_cuota_individual') }}"
      onsubmit="submitForm(event, this)">

  <div class="modal-body">

    <div class="mb-3">
      <label>Unidad</label>
      <select name="unidad_id" class="form-select" required>
        <option value="">Seleccione...</option>
        {% for u in unidades %}
          <option value="{{ u.id }}">
            {{ u.nombre }} - {{ u.etapa.nombre if u.etapa else '' }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Mes</label>
      <input type="month" name="mes" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Monto</label>
      <input type="number" step="0.01" min="0" name="monto" class="form-control" required>
    </div>

    <div class="alert alert-warning">
      Se validará que no exista una cuota previa para ese mes.
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn btn-primary">Crear cuota</button>
  </div>

</form>
