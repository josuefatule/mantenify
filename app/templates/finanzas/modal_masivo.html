{% set hoy = fecha_hoy.strftime('%Y-%m-%d') %}

<div class="modal-header">
  <h5 class="modal-title">Generar cuotas por etapa</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form method="POST"
      action="{{ url_for('finanzas.crear_cuotas_masivas') }}"
      onsubmit="submitForm(event, this)">

  <div class="modal-body">

    <div class="mb-3">
      <label>Proyecto</label>
      <select name="proyecto_id" id="masivoProyecto" class="form-select" required>
        <option value="">Seleccione...</option>
        {% for p in proyectos %}
          <option value="{{ p.id }}">{{ p.nombre }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Etapa</label>
      <select name="etapa_id" id="masivoEtapa" class="form-select" required>
        <option value="">Seleccione un proyecto primero</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Mes a generar</label>
      <input type="month" name="mes" class="form-control" required>
      <small class="text-muted">
        Se creará una cuota para cada unidad de la etapa en ese mes.
      </small>
    </div>

    <div class="mb-3">
      <label>Monto mensual</label>
      <input type="number" step="0.01" min="0" name="monto" class="form-control" required>
    </div>

    <div class="alert alert-info">
      <strong>Nota:</strong> Si alguna unidad ya tiene cuota para ese mes, se omitirá automáticamente.
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn btn-primary">Generar cuotas</button>
  </div>

</form>
